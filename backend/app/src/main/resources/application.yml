spring:
 # La config del DataSource esta en el docker file
  datasource:
    url: jdbc:postgresql://localhost:5432/academia_db
    username: admin
    password: ${DB_PASSWORD:admin-jfdg-admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    properties:
      jakarta:
        persistence:
          schema-generation:
            database:
              action: drop-and-create
      hibernate:
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
  application:
    name: app
  docker:
    compose:
      file: docker-compose.db.yml
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
      file-size-threshold: 2KB

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 hours in milliseconds

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    docExpansion: none
  packages-to-scan: app.rest

# Logging Configuration
logging:
  level:
    root: INFO
    app: INFO
    app.config.ApiLoggingInterceptor: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log

# Application-specific logging configuration
app:
  logging:
    response-body:
      enabled: true          # Enable/disable response body logging
      max-length: 2000       # Maximum characters to log before truncating
    colors:
      enabled: true          # Enable/disable ANSI color codes in console output
    encapsulation:
      enabled: true          # Enable/disable visual request encapsulation

# Stripe Configuration
stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  currency: EUR
  test-mode: true